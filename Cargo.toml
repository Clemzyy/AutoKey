[package]
name = "autokey"
version = "2.0.0"
edition = "2021"
description = "AutoKey - tape des touches ou du texte a une heure precise"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow"] }
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading", "Win32_System_Power", "Win32_UI_HiDpi", "Win32_Graphics_Gdi",
] }

# eframe 0.36 démarre sa fenêtre cachée : sur certains pilotes Intel (Windows 11 récent) le contexte OpenGL
# se bloque alors indéfiniment. Copie locale d'eframe avec une seule ligne changée (fenêtre visible dès la création).
[patch.crates-io]
eframe = { path = "vendor/eframe" }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

